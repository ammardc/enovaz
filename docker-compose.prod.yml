# Override untuk production.
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

services:
  app:
    restart: always
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
    volumes:
      - ./storage:/var/www/html/storage:rw
      - ./bootstrap/cache:/var/www/html/bootstrap/cache:rw
      # Kode read-only di production
      - ./:/var/www/html:ro

  db:
    restart: always
    ports: []
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-storage-engine=InnoDB
      --innodb-buffer-pool-size=256M
      --max-connections=200
    volumes:
      - db-data-prod:/var/lib/mysql

  scheduler:
    restart: always

  mailhog:
    profiles:
      - donotstart

  phpmyadmin:
    profiles:
      - donotstart

volumes:
  db-data-prod:
    driver: local
